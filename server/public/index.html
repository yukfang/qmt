<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QMT Bridge</title>
    <link rel="icon" type="image/svg+xml" href="./favicon-local.svg" />
    <link rel="stylesheet" href="./style.css?v=0.9.33" />
    <script src="./site-env.js?v=0.9.1"></script>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>QMT Bridge</h1>
        <div class="header-actions">
          <button type="button" id="sim-toggle" class="icon-btn" hidden title="调试模式" aria-label="调试模式">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
          </button>
          <button type="button" id="logout-btn" class="icon-btn" hidden title="退出" aria-label="退出">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M15 12H3" />
              <path d="M11 8l-4 4 4 4" />
              <path d="M15 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4" />
            </svg>
          </button>
        </div>
      </div>
      <div class="sub-row">
        <div class="title-meta" aria-label="环境信息">
          <span id="env-badge" class="env-badge">—</span>
          <span id="app-version" class="app-version">v--</span>
          <span class="title-meta-sep" aria-hidden="true"></span>
          <p id="latest-sync">Latest Sync: --</p>
        </div>
        <nav id="stock-switch" class="stock-switch" aria-label="股票"></nav>
      </div>
      <p id="stock-title" class="stock-title">—</p>
      <p id="meta">等待 QMT 推送…</p>
      <div class="toolbar">
        <label class="qty-control">
          <span>默认数量</span>
          <strong id="hang-qty-value">10000</strong>
          <input id="hang-qty" type="range" min="5000" max="15000" step="1000" value="10000" />
        </label>
        <button type="button" id="cruise-btn" class="cruise-btn">巡航</button>
        <button type="button" id="cancel-buys" class="cancel-all-btn buy">买单全撤</button>
        <button type="button" id="cancel-sells" class="cancel-all-btn sell">卖单全撤</button>
      </div>
    </header>
    <main>
      <section class="ladder-section">
        <div class="ladder-head">
          <span>价格</span>
          <span>挂单</span>
          <span>成交</span>
          <span>撤单</span>
        </div>
        <div id="ladder" class="ladder"></div>
      </section>
    </main>
    <div id="alerts" class="alerts"></div>
    <script src="./app.js?v=0.9.37"></script>
  </body>
</html>
